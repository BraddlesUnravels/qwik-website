<title id="lt-step-up-selected-action-title">Selected-action step-up authentication</title>
<desc id="lt-step-up-selected-action-desc">Reconstructed from source, E0001–E0004. Selected-action mechanism and normal flow. Uncovered routes retain ordinary session authentication. No exactly-once guarantee is implied.</desc>
<style>#lt-step-up-selected-action{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#63371d;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#lt-step-up-selected-action .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#lt-step-up-selected-action .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#lt-step-up-selected-action .error-icon{fill:#d99b6b;}#lt-step-up-selected-action .error-text{fill:#587405;stroke:#587405;}#lt-step-up-selected-action .edge-thickness-normal{stroke-width:1px;}#lt-step-up-selected-action .edge-thickness-thick{stroke-width:3.5px;}#lt-step-up-selected-action .edge-pattern-solid{stroke-dasharray:0;}#lt-step-up-selected-action .edge-thickness-invisible{stroke-width:0;fill:none;}#lt-step-up-selected-action .edge-pattern-dashed{stroke-dasharray:3;}#lt-step-up-selected-action .edge-pattern-dotted{stroke-dasharray:2;}#lt-step-up-selected-action .marker{fill:#8a7566;stroke:#8a7566;}#lt-step-up-selected-action .marker.cross{stroke:#8a7566;}#lt-step-up-selected-action svg{font-family:Arial,Helvetica,sans-serif;font-size:16px;}#lt-step-up-selected-action p{margin:0;}#lt-step-up-selected-action .label{font-family:Arial,Helvetica,sans-serif;color:#63371d;}#lt-step-up-selected-action .cluster-label text{fill:#587405;}#lt-step-up-selected-action .cluster-label span{color:#587405;}#lt-step-up-selected-action .cluster-label span p{background-color:transparent;}#lt-step-up-selected-action .label text,#lt-step-up-selected-action span{fill:#63371d;color:#63371d;}#lt-step-up-selected-action .node rect,#lt-step-up-selected-action .node circle,#lt-step-up-selected-action .node ellipse,#lt-step-up-selected-action .node polygon,#lt-step-up-selected-action .node path{fill:#d99b6b;stroke:#9c673f;stroke-width:1px;}#lt-step-up-selected-action .rough-no