<style>
#lt-step-up-selected-action { --lt-text: #e1e0e0; --lt-line: #8a7566; --lt-border: #9c673f; --lt-fill: #d99b6b; --lt-decision: #d99b6b; --lt-label: #fff8f3; --lt-node-opacity: .20; --lt-decision-opacity: .12; --lt-cluster-opacity: .055; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { #lt-step-up-selected-action { --lt-text: #f4ba96; --lt-line: #afafaf; --lt-border: #573a23; --lt-fill: #45240d; --lt-decision: #251207; --lt-label: #251207; --lt-node-opacity: .80; --lt-decision-opacity: .80; --lt-cluster-opacity: .18; } }
#lt-step-up-selected-action .node rect, #lt-step-up-selected-action .node polygon, #lt-step-up-selected-action .node circle, #lt-step-up-selected-action .node path, #lt-step-up-selected-action .node ellipse { fill: var(--lt-fill) !important; fill-opacity: var(--lt-node-opacity) !important; stroke: var(--lt-border) !important; stroke-width: 1.5px !important; }
#lt-step-up-selected-action .node polygon { fill: var(--lt-decision) !important; fill-opacity: var(--lt-decision-opacity) !important; }
#lt-step-up-selected-action .node rect { rx: 10px; ry: 10px; }
#lt-step-up-selected-action .node rect, #lt-step-up-selected-action .node polygon, #lt-step-up-selected-action .node circle, #lt-step-up-selected-action .cluster rect { filter: none !important; }
#lt-step-up-selected-action text, #lt-step-up-selected-action tspan, #lt-step-up-selected-action .nodeLabel, #lt-step-up-selected-action .label, #lt-step-up-selected-action .cluster-label { fill: var(--lt-text) !important; color: var(--lt-text) !important; opacity: 1; }
#lt-step-up-selected-action .flowchart-link { stroke: var(--lt-line) !important; stroke-width: 1.5px; }
#lt-step-up-selected-action .marker, #lt-step-up-selected-action marker path { fill: var(--lt-line) !important; stroke: var(--lt-line) !important; }
#lt-step-up-selected-action .edgeLabel rect, #lt-step-up-selected-action .labelBkg { fill: var(--lt-label) !important; fill-opacity: .80 !important; }
#lt-step-up-selected-action .cluster rect { fill: var(--lt-fill) !important; fill-opacity: var(--lt-cluster-opacity) !important; stroke: var(--lt-border) !important; stroke-opacity: .55; rx: 14px; ry: 14px; }
</style>
<style>
#lt-step-up-selected-action .node text { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 400; text-anchor: middle; }
#lt-step-up-selected-action .edgeLabel text { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 400; }
</style>
