h:0;}#lt-step-up-selected-action .icon-shape,#lt-step-up-selected-action .image-shape{background-color:#ffffff;text-align:center;}#lt-step-up-selected-action .icon-shape p,#lt-step-up-selected-action .image-shape p{background-color:#ffffff;padding:2px;}#lt-step-up-selected-action .icon-shape .label rect,#lt-step-up-selected-action .image-shape .label rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#lt-step-up-selected-action .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#lt-step-up-selected-action .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#lt-step-up-selected-action .node .neo-node{stroke:#9c673f;}#lt-step-up-selected-action [data-look="neo"].node rect,#lt-step-up-selected-action [data-look="neo"].cluster rect,#lt-step-up-selected-action [data-look="neo"].node polygon{stroke:url(#lt-step-up-selected-action-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#lt-step-up-selected-action [data-look="neo"].swimlane.cluster rect{filter:none;}#lt-step-up-selected-action [data-look="neo"].node path{stroke:url(#lt-step-up-selected-action-gradient);stroke-width:1px;}#lt-step-up-selected-action [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#lt-step-up-selected-action [data-look="neo"].node .neo-line path{stroke:#9c673f;filter:none;}#lt-step-up-selected-action [data-look="neo"].node circle{stroke:url(#lt-step-up-selected-action-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#lt-step-up-selected-action [data-look="neo"].node circle .state-start{fill:#000000;}#lt-step-up-selected-action [data-look="neo"].icon-shape .icon{fill:url(#lt-step-up-selected-action-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#lt-step-up-selected-action [data-look="neo"].icon-shape .icon-neo path{stroke:url(#lt-step-up-selected-action-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#lt-step-up-selected-action :root{--