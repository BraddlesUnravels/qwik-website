name: Integration

# Staged container integration checks.
# Stage 1 (this workflow): build the production image and verify connection health.
# Later stages can extend this workflow or add dependent jobs behind the same label gate.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_FILE: docker/docker-compose.yml
  COMPOSE_PROJECT_NAME: qwik-website-integration
  HOST_PORT: "3000"
  ORIGIN: http://localhost:3000

jobs:
  container-health:
    name: Container build and connection health
    if: contains(github.event.pull_request.labels.*.name, 'stage')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Stage 1 — Build production image
        run: docker compose -f "$COMPOSE_FILE" build website

      - name: Stage 1 — Start container
        run: docker compose -f "$COMPOSE_FILE" up -d --no-build website

      - name: Stage 1 — Wait for container health
        run: |
          set -euo pipefail

          echo "Waiting for website service to become healthy..."
          for attempt in $(seq 1 36); do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$(docker compose -f "$COMPOSE_FILE" ps -q website)")"

            echo "Attempt ${attempt}: health=${health:-unknown}"

            if [ "$health" = "healthy" ]; then
              exit 0
            fi

            if [ "$health" = "unhealthy" ]; then
              docker compose -f "$COMPOSE_FILE" logs website
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for healthy container"
          docker compose -f "$COMPOSE_FILE" ps
          docker compose -f "$COMPOSE_FILE" logs website
          exit 1

      # HTTP checks mirror IaC deploy-workload-release.sh verify for qwik-website:
      # GET /health -> 200, GET / -> 200, GET /projects/access-control-demo -> 200.
      - name: Stage 1 — Smoke test the container
        run: |
          set -euo pipefail

          url="${ORIGIN}"
          health_path="/health"
          health_url="${url}${health_path}"

          ready=0
          for _ in $(seq 1 30); do
            health_code="$(curl -sS -o /tmp/scw-live-health -w '%{http_code}' --max-time 10 "${health_url}" || true)"
            if [[ "${health_code}" == '200' ]]; then
              ready=1
              break
            fi
            sleep 5
          done

          if [[ "${ready}" -ne 1 ]]; then
            echo "Live health verification failed for ${health_url}" >&2
            cat /tmp/scw-live-health >&2 || true
            docker compose -f "$COMPOSE_FILE" logs website
            exit 1
          fi

          homepage_code="$(curl -sS -o /tmp/scw-live-home -w '%{http_code}' "${url}/")"
          if [[ "${homepage_code}" != '200' ]]; then
            echo "Homepage expected 200, got ${homepage_code}" >&2
            docker compose -f "$COMPOSE_FILE" logs website
            exit 1
          fi

          # Qwik City uses trailingSlash: false; bare paths are canonical (slash forms 301).
          study_code="$(curl -sS -o /tmp/scw-live-study -w '%{http_code}' "${url}/projects/access-control-demo")"
          if [[ "${study_code}" != '200' ]]; then
            echo "Case study expected 200, got ${study_code}" >&2
            docker compose -f "$COMPOSE_FILE" logs website
            exit 1
          fi

      - name: Collect container logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE_FILE" logs website || true

      - name: Tear down
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down --volumes --remove-orphans || true
