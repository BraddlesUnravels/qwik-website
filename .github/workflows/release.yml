name: Publish release image and initiate deployment

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwik-website-release-${{ github.event.release.id || github.sha }}
  cancel-in-progress: false

env:
  APPLICATION: qwik-website
  CONTAINER_REPOSITORY: qwik-website
  ACR_LOGIN_SERVER: braddlesunravelsacr.azurecr.io
  IAC_REPOSITORY: BraddlesUnravels/iac
  RELEASE_TAG_PATTERN: '^v[0-9]+\.[0-9]+\.[0-9]+$'
  IMAGE_NAME: qwik-website:release-candidate

jobs:
  verify-test-build-push:
    name: Verify, test, build and push release image
    # Manual runs publish the selected main commit. Release events stay tag-gated.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' &&
       !github.event.release.draft &&
       !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: image-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      source-commit-sha: ${{ steps.evidence.outputs.source-commit-sha }}
      image-tag: ${{ steps.evidence.outputs.image-tag }}
      image-digest: ${{ steps.evidence.outputs.image-digest }}
      release-id: ${{ steps.evidence.outputs.release-id }}
      release-tag: ${{ steps.evidence.outputs.release-tag }}
      source-repository: ${{ steps.evidence.outputs.source-repository }}
      source-repository-id: ${{ steps.evidence.outputs.source-repository-id }}
      source-run-id: ${{ steps.evidence.outputs.source-run-id }}

    steps:
      - name: Checkout source commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # release: peel the published tag. workflow_dispatch: current main commit.
          ref: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.sha }}
          fetch-depth: 0

      - name: Validate release source
        id: release_guard
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_ID: ${{ github.event.release.id }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"

          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Source commit SHA must be 40 lowercase hex characters: ${source_sha}" >&2
            exit 1
          fi

          if [[ "${EVENT_NAME}" == 'workflow_dispatch' ]]; then
            if [[ "${EVENT_REF}" != 'refs/heads/main' ]]; then
              echo "Manual releases must run from main (got ${EVENT_REF})." >&2
              exit 1
            fi

            if [[ "${source_sha}" != "${EVENT_SHA}" ]]; then
              echo 'Checked-out HEAD does not match the workflow_dispatch commit.' >&2
              exit 1
            fi

            # No GitHub Release is required. Use run metadata for IaC evidence.
            release_tag="main"
            release_id="${RUN_ID}"
          else
            if [[ "${RELEASE_DRAFT}" == 'true' || "${RELEASE_PRERELEASE}" == 'true' ]]; then
              echo 'Draft and prerelease publications are not deployable.' >&2
              exit 1
            fi

            if [[ ! "${RELEASE_TAG}" =~ ${RELEASE_TAG_PATTERN} ]]; then
              echo "Release tag must match ${RELEASE_TAG_PATTERN}: ${RELEASE_TAG}" >&2
              exit 1
            fi

            tag_object="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"

            if [[ "${source_sha}" != "${tag_object}" ]]; then
              echo 'Checked-out HEAD does not match the peeled release tag commit.' >&2
              exit 1
            fi

            if [[ "${source_sha}" != "${EVENT_SHA}" ]]; then
              echo 'github.sha does not match the peeled release tag commit.' >&2
              exit 1
            fi

            if [[ ! "${RELEASE_ID}" =~ ^[0-9]+$ ]]; then
              echo "Release ID must be numeric: ${RELEASE_ID}" >&2
              exit 1
            fi

            release_tag="${RELEASE_TAG}"
            release_id="${RELEASE_ID}"
          fi

          {
            echo "source-commit-sha=${source_sha}"
            echo "release-tag=${release_tag}"
            echo "release-id=${release_id}"
          } >> "${GITHUB_OUTPUT}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Format
        run: bun run fmt.check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run build.types

      - name: Unit tests
        run: bun run test.unit

      - name: Production client and server build
        run: bun run build.docker

      - name: Component tests
        # v7.4.4+ is required on runners with Node >=24.20 (got v11 socket bug).
        uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
        with:
          install: false
          component: true
          command: bun run test.ct

      # Do not use the action start/wait-on inputs. Their built-in ping uses got and
      # can fail immediately with ERR_SOCKET_CLOSED_BEFORE_CONNECTION on Node >=24.20
      # before Vite binds. bun run test.e2e uses start-server-and-test + wait-on (axios).
      - name: E2E tests
        uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
        with:
          install: false
          command: bun run test.e2e

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build release image
        run: docker build -f docker/Dockerfile -t "${IMAGE_NAME}" .

      # HTTP checks mirror IaC deploy-workload-release.sh verify for qwik-website:
      # GET /health -> 200, GET / -> 200, GET /work/access-control-demo -> 200.
      - name: Smoke test the built image
        shell: bash
        run: |
          set -euo pipefail

          container_name="qwik-release-smoke-${GITHUB_RUN_ID}"
          host_port=18080
          url="http://127.0.0.1:${host_port}"
          health_path="/health"

          cleanup() {
            docker logs "${container_name}" >/tmp/qwik-smoke-logs 2>&1 || true
            docker rm -f "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --rm -d \
            --name "${container_name}" \
            -p "${host_port}:3000" \
            "${IMAGE_NAME}"

          health_url="${url}${health_path}"
          ready=0
          for _ in $(seq 1 30); do
            health_code="$(curl -sS -o /tmp/scw-live-health -w '%{http_code}' --max-time 10 "${health_url}" || true)"
            if [[ "${health_code}" == '200' ]]; then
              ready=1
              break
            fi
            sleep 5
          done

          if [[ "${ready}" -ne 1 ]]; then
            echo "Live health verification failed for ${health_url}" >&2
            cat /tmp/scw-live-health >&2 || true
            docker logs "${container_name}" || true
            exit 1
          fi

          homepage_code="$(curl -sS -o /tmp/scw-live-home -w '%{http_code}' "${url}/")"
          if [[ "${homepage_code}" != '200' ]]; then
            echo "Homepage expected 200, got ${homepage_code}" >&2
            docker logs "${container_name}" || true
            exit 1
          fi

          # Qwik City uses trailingSlash: false; bare paths are canonical (slash forms 301).
          study_code="$(curl -sS -o /tmp/scw-live-study -w '%{http_code}' "${url}/work/access-control-demo")"
          if [[ "${study_code}" != '200' ]]; then
            echo "Case study expected 200, got ${study_code}" >&2
            docker logs "${container_name}" || true
            exit 1
          fi

      - name: Azure OIDC login as image publisher
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_PUBLISHER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR with publisher token
        shell: bash
        run: |
          set -euo pipefail

          token="$(az acr login \
            --name braddlesunravelsacr \
            --expose-token \
            --output tsv \
            --query accessToken)"

          printf '%s' "${token}" | docker login "${ACR_LOGIN_SERVER}" \
            --username 00000000-0000-0000-0000-000000000000 \
            --password-stdin

      - name: Tag, push, and resolve immutable digest
        id: push
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.release_guard.outputs.source-commit-sha }}
        run: |
          set -euo pipefail

          remote_tag="${ACR_LOGIN_SERVER}/${CONTAINER_REPOSITORY}:${SOURCE_SHA}"
          docker tag "${IMAGE_NAME}" "${remote_tag}"

          if az acr repository show \
            --name braddlesunravelsacr \
            --image "${CONTAINER_REPOSITORY}:${SOURCE_SHA}" \
            --output json >/tmp/existing-image.json 2>/dev/null; then
            digest="$(jq -er '.digest // .manifest.digest // empty' /tmp/existing-image.json)"
            echo "Tag already exists in ACR with digest ${digest}; reusing immutable image."
          else
            docker push "${remote_tag}"

            metadata="$(az acr repository show \
              --name braddlesunravelsacr \
              --image "${CONTAINER_REPOSITORY}:${SOURCE_SHA}" \
              --output json)"

            digest="$(jq -er '.digest // .manifest.digest' <<<"${metadata}")"
          fi

          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Resolved digest is malformed: ${digest}" >&2
            exit 1
          fi

          echo "image-tag=${remote_tag}" >> "${GITHUB_OUTPUT}"
          echo "image-digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Record non-secret release evidence
        id: evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.release_guard.outputs.source-commit-sha }}
          IMAGE_TAG: ${{ steps.push.outputs.image-tag }}
          IMAGE_DIGEST: ${{ steps.push.outputs.image-digest }}
          RELEASE_ID: ${{ steps.release_guard.outputs.release-id }}
          RELEASE_TAG: ${{ steps.release_guard.outputs.release-tag }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          {
            echo "source-commit-sha=${SOURCE_SHA}"
            echo "image-tag=${IMAGE_TAG}"
            echo "image-digest=${IMAGE_DIGEST}"
            echo "release-id=${RELEASE_ID}"
            echo "release-tag=${RELEASE_TAG}"
            echo "source-repository=${SOURCE_REPOSITORY}"
            echo "source-repository-id=${SOURCE_REPOSITORY_ID}"
            echo "source-run-id=${SOURCE_RUN_ID}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo '## Release image evidence'
            echo
            echo "- Source repository: \`${SOURCE_REPOSITORY}\`"
            echo "- Release tag: \`${RELEASE_TAG}\`"
            echo "- Release ID: \`${RELEASE_ID}\`"
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Image tag: \`${IMAGE_TAG}\`"
            echo "- Image digest: \`${IMAGE_DIGEST}\`"
            echo "- Source run: \`${SOURCE_RUN_ID}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  dispatch-iac:
    name: Dispatch deployment to IaC repository
    needs: [verify-test-build-push]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Create GitHub App installation token for IaC only
        id: app-token
        uses: actions/create-github-app-token@3ff1caaa28b64c9cc276ce0a02e2ff584f3900c5 # v2.0.2
        with:
          app-id: ${{ vars.IAC_DISPATCH_APP_ID }}
          private-key: ${{ secrets.IAC_DISPATCH_APP_PRIVATE_KEY }}
          owner: BraddlesUnravels
          repositories: iac
          permission-contents: write

      - name: Post repository_dispatch evidence payload
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_REPOSITORY: ${{ needs.verify-test-build-push.outputs.source-repository }}
          SOURCE_REPOSITORY_ID: ${{ needs.verify-test-build-push.outputs.source-repository-id }}
          RELEASE_ID: ${{ needs.verify-test-build-push.outputs.release-id }}
          RELEASE_TAG: ${{ needs.verify-test-build-push.outputs.release-tag }}
          SOURCE_COMMIT_SHA: ${{ needs.verify-test-build-push.outputs.source-commit-sha }}
          IMAGE_TAG: ${{ needs.verify-test-build-push.outputs.image-tag }}
          IMAGE_DIGEST: ${{ needs.verify-test-build-push.outputs.image-digest }}
        run: |
          set -euo pipefail

          # GitHub repository_dispatch client_payload allows at most 10 properties.
          # sourceRunId is optional audit metadata and is intentionally omitted here.
          payload="$(jq -n \
            --arg application 'qwik-website' \
            --arg environment 'production' \
            --arg sourceRepository "${SOURCE_REPOSITORY}" \
            --arg sourceRepositoryId "${SOURCE_REPOSITORY_ID}" \
            --arg releaseId "${RELEASE_ID}" \
            --arg releaseTag "${RELEASE_TAG}" \
            --arg sourceCommitSha "${SOURCE_COMMIT_SHA}" \
            --arg imageTag "${IMAGE_TAG}" \
            --arg imageDigest "${IMAGE_DIGEST}" \
            '{
              event_type: "single-container-web-release-v1",
              client_payload: {
                schemaVersion: 1,
                application: $application,
                environment: $environment,
                sourceRepository: $sourceRepository,
                sourceRepositoryId: $sourceRepositoryId,
                releaseId: $releaseId,
                releaseTag: $releaseTag,
                sourceCommitSha: $sourceCommitSha,
                imageTag: $imageTag,
                imageDigest: $imageDigest
              }
            }')"

          http_code="$(curl --silent --show-error --output /tmp/dispatch-body \
            --write-out '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${IAC_REPOSITORY}/dispatches" \
            -d "${payload}")"

          if [[ "${http_code}" != '204' ]]; then
            echo "repository_dispatch was not accepted (HTTP ${http_code})" >&2
            cat /tmp/dispatch-body >&2 || true
            exit 1
          fi

          accepted_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "accepted-at=${accepted_at}" >> "${GITHUB_OUTPUT}"

          {
            echo '## IaC dispatch'
            echo
            echo '- Status: **dispatch accepted / deployment pending**'
            echo "- Accepted at: \`${accepted_at}\`"
            echo "- IaC repository: \`${IAC_REPOSITORY}\`"
            echo '- Event type: `single-container-web-release-v1`'
            echo "- Central workflow: \`https://github.com/${IAC_REPOSITORY}/actions\`"
            echo
            echo 'Azure deployment success is owned by the IaC repository workflow,'
            echo 'not by this source job.'
          } >> "${GITHUB_STEP_SUMMARY}"
