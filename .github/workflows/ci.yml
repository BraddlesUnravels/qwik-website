name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Format
        run: bun run fmt.check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run build.types

      - name: Unit tests
        run: bun run test.unit

      - name: Build
        run: bun run build

      - name: Component tests
        # v7.4.4+ is required on runners with Node >=24.20 (got v11 socket bug).
        uses: cypress-io/github-action@v7.4.6
        with:
          install: false
          component: true
          command: bun run test.ct

      # Do not use the action start/wait-on inputs. Their built-in ping uses got and
      # can fail immediately with ERR_SOCKET_CLOSED_BEFORE_CONNECTION on Node >=24.20
      # before Vite binds. bun run test.e2e uses start-server-and-test + wait-on (axios).
      - name: E2E tests
        uses: cypress-io/github-action@v7.4.6
        with:
          install: false
          command: bun run test.e2e

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
