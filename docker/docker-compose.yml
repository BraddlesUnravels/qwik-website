name: qwik-website

services:
  website:
    image: qwik-website:production
    build:
      context: ../
      dockerfile: docker/Dockerfile

    restart: unless-stopped

    ports:
      - "${PORT:-3000}:3000"

    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      HOST: 0.0.0.0
      ORIGIN: ${ORIGIN:-http://localhost:3000}

    init: true

    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const res = await fetch('http://localhost:3000/'); if (!res.ok) throw new Error(String(res.status));",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
